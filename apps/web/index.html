<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F0E8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Title, description, canonical, robots and social cards are owned by the
      router (`src/lib/seo.ts` + the `head` option of each route), so they match
      the page actually displayed. Nothing SEO-related is duplicated here: two
      canonicals on one page would contradict each other.
      The title below is only the shell shown before React boots.
    -->
    <title>Seego — Ton prochain voyage, trouvé en un swipe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&amp;family=Hanken+Grotesk:wght@400;500;600;700;800;900&amp;display=swap"
    />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
